name: Build Wall Drop

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install

      - name: Compilar jogo web
        run: bun run build

      - name: Mostrar index.html gerado (confirmação)
        run: cat dist/index.html

      - name: Copiar jogo para Android
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Permissão do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Wall-Drop-APK-V3
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
