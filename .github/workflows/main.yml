name: Build Wall Drop (Verificado)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: ✅ Verificar ou Gerar google-services.json
        run: |
          if [ ! -f android/app/google-services.json ]; then
            if [ -f android/app/google-services.json.example ]; then
              echo "⚠️ google-services.json não encontrado. Usando arquivo base para build..."
              cp android/app/google-services.json.example android/app/google-services.json
            else
              echo "❌ ERRO: google-services.json ou exemplo não existe em android/app/"
              exit 1
            fi
          fi
          echo "✅ google-services.json configurado"

      - name: ✅ Verificar plugin do Google Services
        run: |
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle.kts; then
            echo "❌ ERRO: plugin do Google Services não está aplicado"
            exit 1
          fi
          echo "✅ Plugin OK"

      - name: ✅ Verificar applicationIdSuffix
        run: |
          if grep -q "applicationIdSuffix" android/app/build.gradle.kts; then
            echo "❌ ERRO: applicationIdSuffix encontrado — isso quebra o Firebase"
            exit 1
          fi
          echo "✅ Sem applicationIdSuffix"

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install

      - name: Compilar jogo web
        run: bun run build

      - name: ✅ Verificar index.html gerado
        run: |
          if grep -q 'type="module"' dist/index.html; then
            echo "❌ ERRO: type=\"module\" encontrado — vai crashar no WebView"
            exit 1
          fi
          if grep -qE 'src="/|href="/' dist/index.html; then
            echo "❌ ERRO: caminho absoluto encontrado no HTML"
            exit 1
          fi
          echo "✅ index.html OK"
          cat dist/index.html

      - name: Copiar jogo para Android
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Permissão do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Wall-Drop-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

