<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎙️ NARRADOR VICIANTE - WALL DROP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center top, #1e0836 0%, #080314 50%, #020108 100%);
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Ambient Glows */
    .glow-sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { top: 5%; left: 15%; width: 250px; height: 250px; background: rgba(168, 85, 247, 0.15); }
    .glow-2 { bottom: 10%; right: 15%; width: 280px; height: 280px; background: rgba(6, 182, 212, 0.15); }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      gap: 14px;
      margin: auto 0;
    }

    /* Language Switcher Bar */
    .lang-bar {
      display: flex;
      gap: 6px;
      background: rgba(15, 8, 30, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 4px 8px;
      border-radius: 20px;
      overflow-x: auto;
      max-width: 100%;
      scrollbar-width: none;
    }
    .lang-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 4px 8px;
      font-size: 14px;
      cursor: pointer;
      color: #ffffff;
      opacity: 0.6;
      transition: all 0.2s ease;
    }
    .lang-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }
    .lang-btn.active {
      opacity: 1;
      background: rgba(168, 85, 247, 0.4);
      border-color: #a66cff;
      box-shadow: 0 0 10px rgba(166, 108, 255, 0.6);
      transform: scale(1.05);
    }

    /* Header & Titles */
    .header {
      text-align: center;
      margin-bottom: 4px;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff6bd6, #a66cff, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(166, 108, 255, 0.6);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 700;
      color: #ffb347;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: blink 1.2s infinite ease-in-out;
      text-shadow: 0 0 10px rgba(255, 179, 71, 0.8);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.98); }
    }

    /* Display Box with Neon Border */
    .display-card {
      width: 100%;
      min-height: 120px;
      background: rgba(10, 5, 22, 0.85);
      border: 2px solid #a66cff;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      box-shadow: 0 0 25px rgba(166, 108, 255, 0.3);
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .category-tag {
      position: absolute;
      top: -12px;
      padding: 2px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #000000;
      background: #a66cff;
      box-shadow: 0 0 12px rgba(166, 108, 255, 0.8);
      display: none;
    }

    .phrase-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* 8-Grid of Neon Buttons */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .neon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid;
      border-radius: 16px;
      padding: 12px 10px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .neon-btn:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.25);
    }

    .neon-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    .neon-btn.active-narrating {
      animation: pulseBtn 0.8s infinite alternate;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.04); filter: brightness(1.5); }
    }

    /* Footer & Addiction Bar */
    .footer {
      width: 100%;
      background: rgba(10, 5, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d2ff, #a66cff, #ff6bd6);
      box-shadow: 0 0 10px rgba(255, 107, 214, 0.8);
      transition: width 0.4s ease;
    }

    /* Typewriter Cursor */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 16px;
      background: #00d2ff;
      margin-left: 4px;
      animation: blinkCursor 0.6s infinite;
      vertical-align: middle;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* CINEMATIC 3S PROCESSING OVERLAY */
    .cinematic-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 1, 10, 0.96);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .cinematic-box {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, rgba(20, 10, 40, 0.95) 0%, rgba(8, 3, 18, 0.98) 100%);
      border: 2px solid #a66cff;
      border-radius: 28px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 0 50px rgba(166, 108, 255, 0.5), inset 0 0 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .cinematic-badge {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 3px 12px;
      border-radius: 20px;
      background: #a66cff;
      color: #000;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .reactor-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reactor-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed #00d2ff;
      animation: spinReactor 2.5s linear infinite;
    }

    .reactor-ring-inner {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px dotted #ff6bd6;
      animation: spinReactorReverse 3.5s linear infinite;
    }

    .reactor-core {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid #a66cff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 25px #a66cff;
      animation: pulseCore 1.2s ease-in-out infinite alternate;
    }

    @keyframes spinReactor {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReactorReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseCore {
      0% { transform: scale(0.88); opacity: 0.7; }
      100% { transform: scale(1.12); opacity: 1; }
    }

    .cinematic-category-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: #FFF;
      margin-top: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .cinematic-log {
      font-size: 11px;
      font-weight: 700;
      color: #00d2ff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 10px 0;
      height: 18px;
    }

    .cinematic-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 6px;
    }

    .cinematic-bar-fill {
      height: 100%;
      width: 0%;
      background: #a66cff;
      box-shadow: 0 0 15px #a66cff;
      transition: width 0.05s linear;
    }

    .cinematic-pct-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 10px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>

    function switchLanguage(lang) {
      activeLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(lang));
      });
      const ui = UI_DICTIONARY[lang] || UI_DICTIONARY.pt;
      document.getElementById('mainTitle').innerText = ui.title;
      document.getElementById('mainSubtitle').innerText = ui.subtitle;
      document.getElementById('phraseText').innerText = ui.defaultText;
      document.getElementById('cinematicBadge').innerText = ui.badge;
      document.getElementById('cinematicInitLabel').innerText = ui.initLabel;
      const addictionPct = Math.min(100, Math.floor((phraseCounts / 30) * 100));
      document.getElementById('addictionStatus').innerText = ui.addiction + addictionPct + '%';
      renderButtons();
    }

    // Web Speech API Synthesis
    function speakPhrase(text, langCode) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          const langMap = {
            pt: 'pt-BR', en: 'en-US', es: 'es-ES', fr: 'fr-FR',
            de: 'de-DE', it: 'it-IT', ja: 'ja-JP', zh: 'zh-CN'
          };
          utterance.lang = langMap[langCode] || 'pt-BR';
          utterance.rate = 0.85; // Velocidade 0.85
          utterance.pitch = 0.8; // Tom grave masculino

          const voices = window.speechSynthesis.getVoices();
          const voice = voices.find(v => v.lang.startsWith(langCode) && (
            v.name.toLowerCase().includes('male') ||
            v.name.toLowerCase().includes('homem') ||
            v.name.toLowerCase().includes('lucas') ||
            v.name.toLowerCase().includes('daniel') ||
            v.name.toLowerCase().includes('david') ||
            v.name.toLowerCase().includes('george')
          )) || voices.find(v => v.lang.startsWith(langCode));

          if (voice) utterance.voice = voice;
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn('SpeechSynthesis err:', e);
        }
      }
    }

    // Trigger Narrator Button Click com Animação Cinematográfica de 3s
    function triggerNarrator(categoryIndex) {
      if (isNarrating) return;

      const category = MULTI_LANG_DATA[categoryIndex];
      const phrases = category.phrases[activeLang] || category.phrases.pt;
      const currentIndex = phraseIndexMap[categoryIndex] || 0;
      const phrase = phrases[currentIndex].toUpperCase();
      phraseIndexMap[categoryIndex] = (currentIndex + 1) % phrases.length;

      // Desabilitar botões
      isNarrating = true;
      const allButtons = document.querySelectorAll('.neon-btn');
      allButtons.forEach(b => b.disabled = true);
      allButtons[categoryIndex].classList.add('active-narrating');

      // 1. Ativar Overlay Cinematográfico de Processamento (3 Segundos)
      const overlay = document.getElementById('cinematicOverlay');
      const box = document.getElementById('cinematicBox');
      const badge = document.getElementById('cinematicBadge');
      const ringOuter = document.getElementById('reactorRingOuter');
      const core = document.getElementById('reactorCore');
      const title = document.getElementById('cinematicCategoryTitle');
      const log = document.getElementById('cinematicLog');
      const barFill = document.getElementById('cinematicBarFill');
      const pct = document.getElementById('cinematicPct');

      overlay.style.display = 'flex';
      box.style.borderColor = category.color;
      box.style.boxShadow = `0 0 45px ${category.color}, inset 0 0 30px rgba(0,0,0,0.8)`;
      badge.style.background = category.color;
      ringOuter.style.borderColor = category.color;
      core.style.borderColor = category.color;
      core.style.boxShadow = `0 0 25px ${category.color}`;
      core.innerText = category.emoji;
      title.innerText = category.labels[activeLang] || category.labels.pt;
      title.style.color = '#FFF';
      title.style.textShadow = `0 0 15px ${category.color}`;
      barFill.style.background = category.color;
      barFill.style.boxShadow = `0 0 15px ${category.color}`;
      pct.style.color = category.color;

      const PROCESSING_TIME = 3000;
      const step = 30;
      let elapsed = 0;
      let logIndex = 0;
      const logs = LOGS_DATA[activeLang] || LOGS_DATA.pt;

      const logInterval = setInterval(() => {
        logIndex = (logIndex + 1) % logs.length;
        log.innerText = logs[logIndex];
      }, 600);

      const processInterval = setInterval(() => {
        elapsed += step;
        const currentPct = Math.min(100, Math.floor((elapsed / PROCESSING_TIME) * 100));
        barFill.style.width = currentPct + '%';
        pct.innerText = currentPct + '%';

        if (elapsed >= PROCESSING_TIME) {
          clearInterval(processInterval);
          clearInterval(logInterval);
          overlay.style.display = 'none';

          // Executar narração & atualização de tela
          revealNarrator(category, phrase, allButtons);
        }
      }, step);
    }

    function revealNarrator(category, phrase, allButtons) {
      const ui = UI_DICTIONARY[activeLang] || UI_DICTIONARY.pt;
      phraseCounts++;
      document.getElementById('countDisplay').innerText = phraseCounts;
      const addictionPct = Math.min(100, Math.floor((phraseCounts / 30) * 100));
      document.getElementById('progressFill').style.width = addictionPct + '%';
      document.getElementById('addictionStatus').innerText = ui.addiction + addictionPct + '%';

      // Update display styling
      const displayCard = document.getElementById('displayCard');
      const categoryTag = document.getElementById('categoryTag');
      const phraseText = document.getElementById('phraseText');

      displayCard.style.borderColor = category.color;
      displayCard.style.boxShadow = `0 0 25px ${category.color}`;
      categoryTag.style.display = 'block';
      categoryTag.style.background = category.color;
      categoryTag.innerText = category.labels[activeLang] || category.labels.pt;

      // Speak immediately with Web Speech API
      speakPhrase(phrase, activeLang);

      // Start Typewriter animation
      if (typewriterInterval) clearInterval(typewriterInterval);
      if (completeTimeout) clearTimeout(completeTimeout);

      phraseText.innerHTML = '';
      const totalDuration = 2500;
      const stepTime = Math.max(15, Math.floor(totalDuration / phrase.length));
      let charIdx = 0;

      typewriterInterval = setInterval(() => {
        charIdx++;
        if (charIdx <= phrase.length) {
          phraseText.innerHTML = phrase.slice(0, charIdx) + '<span class="cursor"></span>';
        } else {
          clearInterval(typewriterInterval);
        }
      }, stepTime);

      // Re-enable after speech
      completeTimeout = setTimeout(() => {
        clearInterval(typewriterInterval);
        phraseText.innerHTML = phrase;
        allButtons.forEach(b => {
          b.disabled = false;
          b.classList.remove('active-narrating');
        });
        isNarrating = false;
      }, totalDuration);
    }

    // Initialize buttons on page load
    renderButtons();
  </script>
