<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <title>Wall Drop</title>
    <script>
      // Global Uncaught Exception & Rejection Handlers to prevent Android WebView crashes
      window.onerror = function (message, source, lineno, colno, error) {
        console.warn('[WallDrop Safe Guard] Global error intercepted:', message, 'at', source, lineno, colno, error);
        return true;
      };
      window.onunhandledrejection = function (event) {
        console.warn('[WallDrop Safe Guard] Unhandled promise rejection intercepted:', event.reason);
        if (event && typeof event.preventDefault === 'function') {
          event.preventDefault();
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
